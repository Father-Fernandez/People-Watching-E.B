[package]
name = "People-watching-v2"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.10.4"
serde = {version = "1.0.229", features = ["derive"]}
serde_json = "1.0.154"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# DENY PANICS:
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unchecked_time_subtraction = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
